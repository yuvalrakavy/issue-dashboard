translate.area.drivers    = ["drivers"]
translate.area.hometouch  = ["hometouch"]
translate.area.dev-loop   = ["dev-loop"]
translate.area.harness    = ["harness"]
translate.area.process    = ["process"]
translate.area.media-port = ["media-port"]
translate.area.behaviors  = ["behaviors"]

[repo."yuvalrakavy/airzoned"]
translate.type.todo = ["todo", "enhancement"]
translate.modifier.good_first_issue = ["good first issue"]
translate.modifier.help_wanted      = ["help wanted"]

[repo."rhaiscript/rhai"]
